name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use package.json version)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish to npm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify build output
        run: |
          echo "✓ Checking dist/ exists..."
          test -d dist || exit 1
          echo "✓ Checking package.json..."
          test -f package.json || exit 1
          echo "✓ Checking LICENSE..."
          test -f LICENSE || exit 1
          echo "✓ Checking README.md..."
          test -f README.md || exit 1
          echo "✓ Checking styles.css..."
          test -f styles.css || exit 1
          ls -la dist/

      - name: Get version from tag or package.json
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "source=tag" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "source=package.json" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          body: |
            # @azizul7m/markdown-renderer v${{ steps.version.outputs.version }}

            ✨ **Published to npm!**
            - 🎨 9 beautiful color schemes (Catppuccin, Doom One, Nord, Dracula, Gruvbox, One Dark/Light)
            - 📑 Dynamic Table of Contents
            - 🖨️ A4 print support (PDF export)
            - 📦 7KB gzipped bundle
            - 🌍 Full Unicode support

            ## Installation
            ```bash
            npm install @azizul7m/markdown-renderer
            ```

            ## Quick Start
            ```tsx
            import MarkdownRenderer from "@azizul7m/markdown-renderer";
            import "@azizul7m/markdown-renderer/styles.css";

            <MarkdownRenderer md={markdown} />
            ```

            ## Documentation
            - 📖 [START_HERE.md](https://www.npmjs.com/package/@azizul7m/markdown-renderer)
            - ⚡ [QUICK_REFERENCE.md](https://github.com/Azizul7m/markdown-renderer)
            - 📚 [USAGE_GUIDE.md](https://github.com/Azizul7m/markdown-renderer)
            - 🔧 [README.md](https://github.com/Azizul7m/markdown-renderer)

            See https://www.npmjs.com/package/@azizul7m/markdown-renderer for full documentation.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish success notification
        run: |
          echo "✅ Package published successfully!"
          echo "📦 Package: @azizul7m/markdown-renderer v${{ steps.version.outputs.version }}"
          echo "📍 Registry: https://registry.npmjs.org"
          echo "🔗 npm: https://www.npmjs.com/package/@azizul7m/markdown-renderer"
          echo "🌐 GitHub: https://github.com/Azizul7m/markdown-renderer"
